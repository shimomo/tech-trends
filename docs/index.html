<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tech Trends</title>
    <meta name="description" content="GitHub Trending と Zenn から、Web 系・AI 系で反応の多かったものを毎朝まとめた一覧" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="header-main">
        <h1 class="brand">Tech Trends</h1>
        <nav class="nav" aria-label="日付の移動">
          <button id="prev" type="button" disabled>‹ 前日</button>
          <span id="date" class="date">読み込み中…</span>
          <button id="next" type="button" disabled>翌日 ›</button>
        </nav>
      </div>
      <div class="header-sub">
        <span class="legend"><span class="hot-mark">🔥</span> 前日比で急上昇 ・ <span class="new">NEW</span> 初登場</span>
        <span id="updated" class="updated"></span>
      </div>
    </header>
    <div id="notices" class="notices"></div>
    <main id="grid" class="grid"></main>
    <footer class="footer">
      情報源: <a href="https://github.com/trending" target="_blank" rel="noopener noreferrer">GitHub Trending</a> ・
      <a href="https://zenn.dev/" target="_blank" rel="noopener noreferrer">Zenn</a>
    </footer>
  </body>
</html>
