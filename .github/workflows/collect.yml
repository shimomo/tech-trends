name: collect

on:
  schedule:
    # 21:00 UTC = 06:00 JST
    - cron: "0 21 * * *"
    # 23:00 UTC = 08:00 JST。当日分の Zenn が全件失敗していたときだけ集め直す。
    # ランナーが変われば IP も変わるので、IP 単位の 429 はたいてい抜けられる
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect trends
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 定時実行は当日分が揃っていれば何もしない（cron の遅れで 2 本の順番が入れ替わっても同じ結果になる）。
          # 手動実行は常に集め直す
          COLLECT_ARGS: ${{ github.event_name == 'schedule' && '--if-needed' || '' }}
        run: npm run collect -- $COLLECT_ARGS

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Fail if collection reported errors
        if: steps.collect.outcome == 'failure'
        run: exit 1
