name: collect

on:
  schedule:
    # 21:00 UTC = 06:00 JST
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect trends
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi

      - name: Fail if collection reported errors
        if: steps.collect.outcome == 'failure'
        run: exit 1
